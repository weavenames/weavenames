[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weavenames"
version = "0.0.1"
description = "Naming for builders — generates project names and verifies availability across PyPI, npm, GitHub, and domain registries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kyle Northup", email = "kylenorthup@gmail.com" }]
keywords = ["naming", "branding", "domain", "pypi", "npm", "availability", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "whodap>=0.1.10",
    "rich>=13.7.0",
    "click>=8.1.7",
    "pydantic>=2.6.0",
    "better-profanity>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "twine>=5.0",
]

[project.scripts]
weavenames = "weavenames.cli:main"

[project.urls]
Homepage = "https://weavenames.com"
Repository = "https://github.com/weavenames/weavenames"
Issues = "https://github.com/weavenames/weavenames/issues"

[tool.hatch.build.targets.wheel]
packages = ["weavenames"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
